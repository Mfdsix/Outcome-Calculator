# nginx server block for https://expense.zgenit.site (VPS edge).
#
# Architecture: nginx (TLS, certbot) → 127.0.0.1:6600 (expense-app-web nginx).
# Caddy stays stopped on this host: docker compose -f docker-compose.prod.yml
# up -d   (caddy is behind the "caddy" profile, so it does not start).
#
# One-time:
#   1. DNS A record of expense.zgenit.site → this VPS.
#   2. sudo certbot certonly --nginx -d expense.zgenit.site
#      (or: sudo certbot --nginx -d expense.zgenit.site — then certbot writes
#       these ssl_certificate lines itself and this file is redundant TLS-wise)
#   3. sudo cp deploy/nginx-expense.conf /etc/nginx/conf.d/expense.conf
#      sudo nginx -t && sudo systemctl reload nginx
#
# Service-worker/PWA note: HTTPS is terminated HERE, so the browser sees a
# secure context and the PWA install works even though the upstream hop is
# plain HTTP on the docker bridge.

server {
    listen 80;
    server_name expense.zgenit.site;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name expense.zgenit.site;

    # Adjust to the certbot live path for this domain.
    ssl_certificate     /etc/letsencrypt/live/expense.zgenit.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/expense.zgenit.site/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:6600;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
