server {
  listen 80;
  listen [::]:80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # PWA: the service worker must be served as-is (never the SPA fallback)
  # and revalidated on every navigation so updates are picked up (plan §3.5).
  location = /sw.js {
    try_files $uri =404;
    add_header Cache-Control "no-cache";
    add_header Service-Worker-Allowed "/";
  }

  # Manifest: correct MIME + revalidate.
  location = /manifest.webmanifest {
    default_type application/manifest+json;
    try_files $uri =404;
    add_header Cache-Control "no-cache";
  }

  # Icons: long-lived cache (filenames are static placeholders).
  location /icons/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=604800";
  }

  location = /apple-touch-icon.png {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=604800";
  }

  # SPA fallback: any route that isn't a real file → index.html
  location / {
    try_files $uri $uri/ /index.html;
  }

  # API reverse proxy → api service (internal Docker network only).
  location /api {
    proxy_pass http://api:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
