services:
  postgres:
    image: postgres:16-alpine
    container_name: expense-app-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: expense
      POSTGRES_PASSWORD: expense
      POSTGRES_DB: expense
    # Not published — reachable only by sibling containers via the internal network.
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U expense -d expense"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: expense-app-api
    restart: unless-stopped
    env_file:
      - apps/api/.env
    environment:
      # Compose-internal address; overrides any localhost URL baked into apps/api/.env.
      DATABASE_URL: postgresql://expense:expense@postgres:5432/expense
    depends_on:
      postgres:
        condition: service_healthy
    # API is internal-only — not published to the host.
    expose:
      - "3000"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_URL: ""
    container_name: expense-app-web
    restart: unless-stopped
    # HTTP entry — bound to localhost only; the VPS nginx (TLS edge) proxies
    # https://$CADDY_DOMAIN → 127.0.0.1:6600. Public exposure would skip TLS.
    ports:
      - "127.0.0.1:6600:80"
    depends_on:
      - api

  # HTTPS edge — OPTIONAL (profile "caddy"). Only run this on a host WITHOUT
  # an existing nginx on 80/443: `docker compose -f docker-compose.prod.yml
  # --profile caddy up -d`. With nginx in front (TLS + certbot), deploy
  # without the profile and point the nginx server block at 127.0.0.1:6600
  # (see deploy/nginx-expense.conf).
  caddy:
    image: caddy:2-alpine
    container_name: expense-app-caddy
    restart: unless-stopped
    profiles:
      - caddy
    environment:
      CADDY_DOMAIN: ${CADDY_DOMAIN:?Set CADDY_DOMAIN in the root .env (see .env.example)}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile.prod:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - web

volumes:
  postgres-data:
  caddy-data:
  caddy-config:
